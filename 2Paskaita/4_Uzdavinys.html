<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Contact Us</h1>
    <p>Fill in the form below to contact us.</p>
    <form action="Null">
      <label for="Username">Name:</label>
      <input type="text" id="Username" name="Username" placeholder="John Doe" />
      <br />
      <br />
      <label for="Email">Email:</label>
      <input
        type="email"
        id="Email"
        name="Email"
        placeholder="Jhon@gmail.com"
      />
      <br />
      <br />
      <p>Please select your issue:</p>
      <ul>
        <input type="radio" id="Technical" name="issue" />
        Technical
        <br />
        <input type="radio" id="Delivery" name="issue" />
        Delivery
        <br />
        <input type="radio" id="Payment" name="issue" />
        Payment
        <br />
        <p>Your message:</p>
        <textarea rows="10"></textarea>

        <br />
        <br />
        <input type="submit" />
      </ul>
    </form>
  </body>
</html>
